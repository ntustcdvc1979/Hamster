<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#f08a24">
  <title>尋找內心的倉鼠</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 加入 -->
  <div id="joinScreen" class="screen center">
    <div class="card">
      <div class="big-emoji">🐹</div>
      <div class="title">尋找內心的倉鼠</div>
      <p class="muted">輸入主持人給你的代碼加入遊戲</p>
      <label for="codeInput">遊戲代碼</label>
      <input id="codeInput" class="code-input" maxlength="4" placeholder="ABCD" autocomplete="off">
      <label for="nameInput">你的暱稱</label>
      <input id="nameInput" maxlength="16" placeholder="例如：小倉">
      <button class="btn" id="joinBtn">出發找倉鼠！</button>
      <p class="muted" style="margin-top:16px">需要開啟定位權限 📍<br><a href="index.html">← 回首頁</a></p>
    </div>
  </div>

  <!-- 遊戲中 -->
  <div id="gameScreen" class="player-app hidden">
    <div class="p-head">
      <div style="font-size:34px">🐹</div>
      <div class="grow">
        <div class="name" id="meName"></div>
        <div class="muted" id="roomLabel"></div>
      </div>
      <div style="font-weight:900;font-size:20px"><span id="foundN">0</span>/<span id="totalN">0</span></div>
    </div>
    <div class="progress"><div id="progBar"></div></div>

    <div class="radar lv0" id="radar">
      <div class="lbl" id="radarLbl">離最近的倉鼠還有</div>
      <div><span class="dist" id="distNum">--</span><span class="unit" id="distUnit"></span></div>
      <div class="temp" id="tempLbl">取得定位中…</div>
      <div class="trend" id="trendLbl"></div>
      <div class="acc" id="accLbl"></div>
    </div>

    <button class="btn find-btn" id="findBtn" disabled>🔍 我找到了！</button>

    <div class="bag">
      <h3>🎒 我的收藏</h3>
      <div class="bag-items" id="bagItems"><span class="muted">還沒有找到任何東西</span></div>
    </div>
  </div>

  <!-- 揭曉 -->
  <div id="revealSheet" class="overlay middle hidden">
    <div class="sheet reveal">
      <div class="big-emoji" id="revealEmoji">🐹</div>
      <div class="muted" id="revealSub">你找到了</div>
      <div class="item-name" id="revealName"></div>
      <div class="item-desc" id="revealDesc"></div>
      <button class="btn" data-close>收進背包 🎒</button>
    </div>
  </div>

  <script type="module" src="player.js"></script>
</body>
</html>
