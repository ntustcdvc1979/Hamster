<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#f08a24">
  <title>倉鼠主持人</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div id="hostApp" class="host-app">
    <div class="topbar">
      <div class="grow">
        <div class="room-code" style="letter-spacing:.02em">🐹 主持人</div>
        <div class="room-name">選物品 → 點地圖放置；玩家依 1→4 順序尋找</div>
      </div>
      <button class="btn small" id="shareBtn">📲 玩家連結</button>
    </div>

    <div style="position:relative; flex:1; display:flex; min-height:0">
      <div id="map"></div>
      <div class="map-hint" id="mapHint"></div>
      <div class="fab-col" style="bottom:16px">
        <button class="fab" id="locateBtn" title="移到我的位置">📍</button>
      </div>
    </div>

    <div class="panel" id="panel">
      <div class="panel-handle" id="panelHandle"><span></span></div>
      <div class="tabs">
        <button data-tab="items" class="active">物品 <span id="placedCount">0</span>/4</button>
        <button data-tab="players">玩家 <span id="playerCount">0</span><span id="waitBadge" class="hidden" style="background:var(--danger);color:#fff;border-radius:10px;padding:0 6px;margin-left:4px;font-size:12px"></span></button>
        <button data-tab="settings">設定</button>
      </div>
      <div class="tab-body" id="tab-items"></div>
      <div class="tab-body hidden" id="tab-players"></div>
      <div class="tab-body hidden" id="tab-settings">
        <label for="radiusInput">找到的判定範圍（公尺）</label>
        <input id="radiusInput" type="number" inputmode="numeric" min="3" max="200" value="15">
        <p class="muted">玩家距離物品在這個範圍內，才能按「找到了」。永吉國中操場等空曠處 GPS 誤差約 5–10 公尺、靠近大樓會到 15–20 公尺，建議設 12–15；四個物品之間最好相隔 40 公尺以上。</p>
        <label style="display:flex;align-items:center;gap:8px;font-weight:400">
          <input type="checkbox" id="showPlayers" checked style="width:auto"> 在地圖上顯示玩家位置
        </label>
        <button class="btn secondary" id="saveSettingsBtn">儲存設定</button>
        <button class="btn secondary" id="resetBtn">🔄 清空所有玩家進度</button>
      </div>
    </div>
  </div>

  <!-- 編輯物品說明 -->
  <div id="editSheet" class="overlay hidden">
    <div class="sheet">
      <h3><span class="item-ico" id="editIco" style="width:36px;height:36px"></span><span id="editTitle">編輯說明</span><button class="close" data-close>×</button></h3>
      <div id="editFields"></div>
      <button class="btn" id="saveEditBtn">💾 儲存（玩家畫面會立即更新）</button>
      <button class="btn secondary" id="resetEditBtn">↩️ 還原成預設內容</button>
    </div>
  </div>

  <!-- 玩家連結 -->
  <div id="shareSheet" class="overlay middle hidden">
    <div class="sheet" style="text-align:center">
      <h3>玩家連結<button class="close" data-close>×</button></h3>
      <p class="muted">玩家掃 QR code 或打開連結就能直接開始</p>
      <div class="qr-box" id="qr"></div>
      <div class="link-box" id="shareLink"></div>
      <div class="row">
        <button class="btn secondary" id="copyBtn">複製連結</button>
        <button class="btn" id="nativeShareBtn">分享</button>
      </div>
    </div>
  </div>

  <script type="module" src="host.js"></script>
</body>
</html>
